[package]
name = "negentropy"
version = "0.5.2"
edition = "2018"
description = "Rust implementation of the negentropy set-reconciliation protocol."
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/rust-nostr/negentropy"
repository = "https://github.com/rust-nostr/negentropy.git"
license = "MIT"
rust-version = "1.51.0" # MSRV
exclude = ["fuzz"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = []

[[example]]
name = "negentropy"

[workspace]
members = ["fuzz/*"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)'] }
